[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard"
version = "0.1.0"
description = "Self-built OpenAI-compatible research and paper-trading harness"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13,<16",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
finguard = "finguard.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
